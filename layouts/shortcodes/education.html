{{ with hugo.Data.about.education }}
<section class="about-section">
    <h2>// EDUCATION</h2>

    <div class="about-card about-terminal-card">
        <header class="terminal-window-header" aria-label="Education terminal window">
            <span class="terminal-window-dots" aria-hidden="true">
                <span></span><span></span><span></span>
            </span>
            <span class="terminal-window-title">christian@portfolio: ~/education</span>
        </header>
        <h3>{{ .university }}</h3>
        <p class="about-accent">{{ .degree }}</p>

        <div class="about-tags">
            <span>{{ .graduation }}</span>
            <span>GPA: {{ .gpa }}</span>
        </div>

        {{ range .achievements }}
        <p>{{ . }}</p>
        {{ end }}
    </div>
</section>
{{ end }}
