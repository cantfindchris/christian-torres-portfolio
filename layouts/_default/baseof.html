<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "en-us" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ if or .IsHome (eq .Path "/about") }}
    <script src="{{ "js/about-animations.js" | relURL }}" defer></script>
  {{ end }}
  {{ if eq .Path "/contact" }}
    <script src="{{ "js/contact-animations.js" | relURL }}" defer></script>
  {{ end }}
  <script src="{{ "js/mobile-menu.js" | relURL }}" defer></script>
</body>
</html>
